spring.application.name=play-your-list

server.port=8080

# Banco H2 em memoria (console em http://localhost:8080/h2-console)
spring.datasource.url=jdbc:h2:mem:playyourlist;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Nao deixar o Hibernate criar as tabelas: quem cria e o data.sql (schema-as-data)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# URLs usadas pelos Feign clients do modulo "api".
# Como os 4 "microsservicos" rodam dentro do mesmo projeto/porta (conforme o enunciado),
# todos apontam para o proprio host. Se um dia forem separados em projetos distintos,
# basta apontar cada URL para a porta/host real de cada servico.
services.musica.url=http://localhost:${server.port}
services.playlist.url=http://localhost:${server.port}
services.reproducao.url=http://localhost:${server.port}
